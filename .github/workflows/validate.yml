name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/ecotech_local
      - name: Validate JSON
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
              print(f"OK {path}")
          PY
      - name: Check manifest requirements
        run: |
          python -c "import json; m=json.load(open('custom_components/ecotech_local/manifest.json')); assert 'python-mobius' in str(m['requirements']), 'missing python-mobius'; print('manifest OK', m['requirements'])"
